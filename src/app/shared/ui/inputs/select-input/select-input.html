<div class="input-container" [class.is-disabled]="disabled" autocomplete="off">
  <label class="input-label" *ngIf="label">{{ label }}</label>

  <div class="input-select-wrapper">
    <input
      class="input-box"
      type="search"
      autocomplete="new-password"
      aria-autocomplete="none"
      role="searchbox"
      inputmode="search"
      spellcheck="false"
      autocorrect="off"
      autocapitalize="off"
      [placeholder]="loading ? 'Loading…' : placeholder"
      [value]="inputValue"
      [disabled]="disabled || loading"

      [attr.readonly]="(disabled || loading) ? null : ''"
      (focus)="$event.target.removeAttribute('readonly')"

      (input)="onSearch($event)"
      (keydown)="onKeydown($event)"
      (blur)="onBlur()"
    />

    <span class="input-spinner" *ngIf="loading"></span>

    <ul class="input-search-ul" *ngIf="results.length > 0">
      <li
        class="input-search-li"
        *ngFor="let item of results; let i = index; trackBy: trackById"
        [class.active]="i === activeIndex"
        (mouseenter)="onHoverIndex(i)"
        (mousedown)="onItemSelected(item)"
      >
        {{ item.name }}
      </li>
    </ul>
  </div>
</div>
