<div class="input-container" autocomplete="off">
  <label class="input-label">{{ label }}</label>

  <input
    type="search"
    class="input-box"
    [placeholder]="placeholder"
    autocomplete="off"
    aria-autocomplete="none"
    role="searchbox"
    inputmode="search"
    spellcheck="false"
    autocorrect="off"
    autocapitalize="off"
  />
</div>
