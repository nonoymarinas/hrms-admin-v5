@if (isEditMode) {
<div class="contact-content-cont">
  <ui-manual-input label="Mobile No." placeholder="mobile number"></ui-manual-input>
  <ui-manual-input label="Landline No." placeholder="landline number"></ui-manual-input>
  <ui-manual-input label="Email add" placeholder="email address"></ui-manual-input>
</div>
} @else {
<div class="contact-content-cont">
  <ui-view-item label="Mobile No." value="+1 234 567 8901"></ui-view-item>
  <ui-view-item label="Landline No." value="+1 234 567 8902"></ui-view-item>
  <ui-view-item label="Email add" value="john.doe@example.com"></ui-view-item>
</div>
}
